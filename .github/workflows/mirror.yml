name: Mirror vers le repo Epitech

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push vers le repo Epitech
        env:
          PAT: ${{ secrets.EPITECH_PAT }}
        run: |
          git remote add epitech https://x-access-token:${PAT}@github.com/EpitechMscProPromo2029/T-ENT-500-PAR-5-1-portfolio-3.git
          git push epitech main --force
